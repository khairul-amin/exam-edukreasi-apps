<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Server Error</title>
    <style>
        @font-face {
            font-family: 'Source Code Pro';
            src: url('file:///android_asset/fonts/SourceCodePro-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --block-background: #555;
            --block-border: 1px solid #000;
            --block-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2) inset;
            --block-light-background: linear-gradient(to right, #2579ba 0%, #0089f2 26%, #214db2 50%, #010023 51%, #0d0e19 100%);
            --block-light-border: 5px solid;
        }

        * {
            box-sizing: border-box;
        }

        main {
            width: 100vw;
            height: 100vh;
            min-height: 450px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #wrap {
            width: 300px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
        }

        .line {
            position: absolute;
            left: 0;
            top: 33%;
            width: 100%;
        }

        .line.line-1 {
            animation: anim-line1 5s 0s ease forwards;
        }

        .line.line-2 {
            animation: anim-line2 5s 1.2s ease forwards;
        }

        .line.line-3 {
            animation: anim-line3 5s 2.4s ease forwards;
        }

        .hand {
            position: absolute;
            top: 50%;
            width: 100%;
            transform-origin: 50% 0;
        }

        .hand.hand-left {
            left: 6px;
            animation: anim-hand-left 5s 0s ease forwards;
        }

        .hand.hand-right {
            right: 6px;
            animation: anim-hand-right 5s 0.5s ease forwards;
        }

        .hand-part {
            height: 2px;
            width: 30px;
            background: #000;
            position: absolute;
        }

        .hand-part.part-bottom {
            top: -10px;
            left: 0;
            height: 20px;
            border-radius: 7px;
            background: #ccc;
            border-bottom: 4px solid #000;
        }

        .hand-part.part-middle {
            left: 26px;
            top: -10px;
            transform: rotate(-40deg);
        }

        .hand-part.part-top {
            left: 45px;
            top: -32px;
            transform: rotate(-60deg);
        }

        .hand.hand-right .hand-part.part-bottom {
            left: auto;
            right: 0;
        }

        .hand.hand-right .hand-part.part-middle {
            left: auto;
            right: 26px;
            transform: rotate(40deg);
        }

        .hand.hand-right .hand-part.part-top {
            left: auto;
            right: 45px;
            transform: rotate(60deg);
        }

        #server {
            width: 150px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 3px solid #1C1000;
            padding-bottom: 2%;
            background: #1C1000;
            position: relative;
        }

        .eye {
            position: absolute;
            top: -12px;
            width: 20px;
            height: 25px;
            border: 1px solid #000;
            box-shadow: 0 0 0 2px #ccc;
            background: #fff;
            border-radius: 50%;
        }

        .eye span {
            display: block;
            width: 50%;
            height: 50%;
            border: 1px solid;
            border-radius: 50%;
            background: #000;
            position: absolute;
            left: 0;
            top: 1px;
            animation: anim-eyes 8s ease forwards;
        }

        .eye.eye-left {
            left: 30px;
        }

        .eye.eye-right {
            right: 30px;
        }

        .block {
            border: var(--block-border);
            height: 11%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--block-shadow);
            background: var(--block-background);
        }

        .block .light {
            width: calc(100% - 4px);
            height: 12px;
            border-bottom: var(--block-light-border);
            background: var(--block-light-background);
        }

        #bottom-block {
            height: 30%;
            border: var(--block-border);
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--block-background);
            box-shadow: var(--block-shadow);
            overflow: hidden;
            position: relative;
        }

        #bottom-light {
            width: 2vw;
            height: 2vw;
            min-width: 14px;
            min-height: 14px;
            border-radius: 4px;
            background: #fff;
            border: 2px solid #ccc;
            box-shadow: var(--block-shadow);
            z-index: 2;
        }

        .bottom-line {
            width: calc(100% - 4px);
            height: 3px;
            background: #fff;
            position: absolute;
            border-bottom: 2px solid #ccc;
        }

        #code-error {
            width: 60%;
            min-width: 320px;
            text-align: center;
        }

        #code-error h1 {
            font-family: 'Source Code Pro', monospace;
            font-size: 4vw;
            font-weight: bold;
            margin: 1vw 0;
        }
        @keyframes anim-line1 {
            0% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(90deg);
            }
            50% {
                transform: rotate(180deg);
            }
            75% {
                transform: rotate(270deg);
            }
            100% {
                transform: rotate(360deg) translateY(40px);
            }
        }

        @keyframes anim-line2 {
            0% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(90deg);
            }
            50% {
                transform: rotate(180deg);
            }
            75% {
                transform: rotate(270deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes anim-line3 {
            0% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(90deg);
            }
            50% {
                transform: rotate(180deg);
            }
            75% {
                transform: rotate(270deg);
            }
            100% {
                transform: rotate(360deg) translateY(-40px);
            }
        }

        @keyframes anim-hand-left {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(3deg);
            }
        }

        @keyframes anim-hand-right {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(-3deg);
            }
        }

        @keyframes anim-eyes {
            0%, 100% {
                left: 0;
            }
            25%, 75% {
                left: 10px;
            }
            50% {
                top: 7px;
                left: 5px;
            }
        }
    #bottom-block {
        height: 30%;
        border: 1px solid #000;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #555;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.2) inset;
        overflow: hidden;
        position: relative;
    }

    #bottom-light {
        width: 2vw;
        height: 2vw;
        min-width: 14px;
        min-height: 14px;
        border-radius: 4px;
        background: #fff;
        border: 2px solid #ccc;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.2) inset;
        z-index: 2;
    }

    .bottom-line {
        width: calc(100% - 4px);
        height: 3px;
        background: #fff;
        position: absolute;
        border-bottom: 2px solid #ccc;
    }

    #error-message {
        margin-top: 24px;
    }

    #error-message h1 {
        font-family: 'Source Code Pro', monospace;
        font-size: 18px;
        color: #d32f2f;
        margin-bottom: 16px;
    }

    button {
        padding: 12px 20px;
        margin: 8px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: #fff;
    }

    #reload-button { background-color: #388e3c; }

    #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
    }

    #loading-overlay p { color: #fff; margin-top: 12px; font-size: 16px; }

    .spinner {
        border: 6px solid #f3f3f3;
        border-top: 6px solid #fff;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    }

    </style>
</head>
<body>
<main>
    <div id="wrap">
        <div class="hand hand-left">
            <span class='hand-part part-top'></span>
            <span class='hand-part part-middle'></span>
            <span class='hand-part part-bottom'></span>
        </div>
        <div class="hand hand-right">
            <span class='hand-part part-top'></span>
            <span class='hand-part part-middle'></span>
            <span class='hand-part part-bottom'></span>
        </div>
        <div id="server">
            <div class="eye eye-left"><span></span></div>
            <div class="eye eye-right"><span></span></div>
            <div class="block">
                <div class="light"></div>
            </div>
            <div class="block">
                <div class="light"></div>
            </div>
            <div class="block">
                <div class="light"></div>
            </div>
            <div class="block">
                <div class="light"></div>
            </div>
            <div class="block">
                <div class="light"></div>
            </div>
            <div id="bottom-block">
                <div class="bottom-line"></div>
                <div id="bottom-light"></div>
            </div>
        </div>
    </div>

    <div id="code-error">
        <h1>Tidak ada internet. Silahkan cek koneksi dan reload halaman ujian!</h1>
        <button id="reload-button" onclick="reloadPage()">🔄 Reload Halaman</button>
    </div>
</main>
<div id="loading-overlay">
    <div class="spinner"></div>
    <p>Memuat ulang, mohon tunggu...</p>
</div>

<script>
    function reloadPage() {
        if (typeof Android !== 'undefined' && Android.reloadPage) {
            document.getElementById('loading-overlay').style.display = 'flex';
            Android.reloadPage();
        } else {
            alert("Fitur ini hanya tersedia di aplikasi.");
        }
    }
</script>
</body>
</html>
